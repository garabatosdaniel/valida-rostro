# =============================================================================
# nginx.conf - Configuracion de Nginx para servir la SPA de React
# =============================================================================
# Todas las rutas que no sean archivos estaticos se redirigen a index.html
# para que React maneje el ruteo del lado del cliente.
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cualquier ruta que no sea un archivo existente -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets estaticos (JS, CSS, imagenes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
